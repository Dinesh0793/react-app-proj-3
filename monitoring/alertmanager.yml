global:
  resolve_timeout: 5m

# Route alerts to receivers
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'email-alerts'

  routes:
    # Critical alerts go immediately
    - match:
        severity: critical
      receiver: 'email-alerts'
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: 'email-alerts'
    email_configs:
      - to: 'YOUR_EMAIL@gmail.com'          # ← Replace with your email
        from: 'alerts@devops-project.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'YOUR_GMAIL@gmail.com'   # ← Replace with your Gmail
        auth_identity: 'YOUR_GMAIL@gmail.com'   # ← Replace with your Gmail
        auth_password: 'YOUR_APP_PASSWORD'      # ← Replace with Gmail App Password
        send_resolved: false   # Only alert when DOWN (not when resolved)
        headers:
          Subject: '🚨 [ALERT] {{ .GroupLabels.alertname }} - React App'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
