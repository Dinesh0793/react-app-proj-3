global:
  resolve_timeout: 5m

# Route alerts to receivers
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'email-alerts'

  routes:
    # Critical alerts go immediately
    - match:
        severity: critical
      receiver: 'email-alerts'
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: 'email-alerts'
    email_configs:
      - to: 'awsdinesh07@gmail.com'
        from: 'awsdinesh07@gmail.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'awsdinesh07@gmail.com'
        auth_identity: 'awsdinesh07@gmail.com'
        auth_password: 'YOUR_16_CHAR_APP_PASSWORD_HERE'
        send_resolved: false   # Only alert when DOWN (not when resolved)
        headers:
          Subject: '🚨 [ALERT] {{ .GroupLabels.alertname }} - React App'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
